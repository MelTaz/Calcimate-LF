  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #ccfbf1;
      --accent: #0284c7;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(82px + var(--safe-bottom));
      overscroll-behavior-y: none;
    }

    /* Top Header with Safe-Area Padding */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: calc(14px + var(--safe-top)) 16px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 10px rgba(15, 118, 110, 0.2);
    }

    .header-row {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rdi-pill {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* Date Navigation */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border-radius: 14px;
      padding: 8px 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .date-nav-btn {
      background: var(--bg);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }

    .date-label {
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    /* MyFitnessPal Equation Card */
    .summary-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
